<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>Contact Us | Dunmow Computer Services</title>

    <meta name="description" content="Get in touch with Dunmow Computer Services for all your technology needs.">
    <meta name="author" content="John Howard">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#13233f">

    <!-- Canonical -->
    <link rel="canonical" href="https://www.dunmowcomputerservices.com/contact.html">

    <!-- Open Graph -->
    <meta property="og:title" content="Contact Us | Dunmow Computer Services">
    <meta property="og:description" content="Get in touch with Dunmow Computer Services for all your technology needs.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.dunmowcomputerservices.com/contact.html">
    <meta property="og:image" content="https://www.dunmowcomputerservices.com/images/dcs-logo.png">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico">

    <!-- Google Analytics -->
    <script>
    if (location.hostname === 'www.dunmowcomputerservices.com' ||
        location.hostname === 'dunmowcomputerservices.com') {

        const gaScript = document.createElement('script');
        gaScript.async = true;
        gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-92GT0N6XGF';
        document.head.appendChild(gaScript);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;

        gtag('js', new Date());
        gtag('config', 'G-92GT0N6XGF');
    }
    </script>
</head>

<body>

    <!-- Header -->
    <div id="header"></div>

    <!-- Navigation -->
    <div id="navigation"></div>

    <!-- Main Content -->
    <main class="main-content">

        <section class="content-section contact-section">
            <div class="container"> 

                <h2>Contact Us</h2>

                <p>
                    Need help? Send a message and we’ll get back to you as soon as possible.
                </p>

                <form id="contactForm" class="contact-form" method="post">

                    <div id="formStatus" class="form-status"></div>

                    <div class="form-group">
                        <label for="name">Name<span class="form-required">*</span></label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email address<span class="form-required">*</span></label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone number</label>
                        <input type="tel" id="phone" name="phone">
                    </div>

                    <div class="form-group">
                        <label for="service">What do you need help with?</label>
                        <select id="service" name="service">
                            <option value="">Please choose...</option>
                            <option value="Computer repair or upgrade">Computer repair or upgrade</option>
                            <option value="Wi-Fi or printer help">Wi-Fi or printer help</option>
                            <option value="Email or account support">Email or account support</option>
                            <option value="New computer setup">New computer setup</option>
                            <option value="Business technology support">Business technology support</option>
                            <option value="AI automation">AI automation</option>
                            <option value="Something else">Something else</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Message<span class="form-required">*</span></label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>

                    <div class="form-group">
                        <br />
                        <button type="submit" class="btn btn-secondary">Send Message</button>
                    </div>
                </form>

            </div>
        </section>

    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- JavaScript -->
    <script type="module" src="/js/main.js"></script>
    <script src="/js/forms.js"></script>

</body>
</html>
